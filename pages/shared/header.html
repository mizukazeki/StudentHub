      <!-- ==================== TOP NAVIGATION BAR / HEADER ==================== -->
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="Open Navigation Menu">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="page-breadcrumb">
            <span class="breadcrumb-root">BANTUG UNIVERSITY</span>
            <span class="breadcrumb-sep">/</span>
            <h1 class="page-title" id="topbarPageTitle">Dashboard</h1>
          </div>
        </div>

        <div class="topbar-center">
          <div class="global-search-wrapper" id="globalSearchWrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2"
              fill="none">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="globalSearchInput" class="global-search-input"
              placeholder="Search BSIT 2-2 subjects, instructors, tasks, notices..." aria-label="Global Portal Search"
              autocomplete="off" />
            <div class="global-search-results" id="globalSearchResults" hidden></div>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Role Switcher Pill (Quick Demo Switcher) -->
          <button type="button" class="role-Indicator-btn" id="quickSwitchRoleBtn"
            title="Switch Portal Role or Return to Login">
            <span class="role-dot" id="topbarRoleDot"></span>
            <span id="topbarRoleLabel">Student</span>
          </button>

          <div class="topbar-date" id="topbarDateDisplay" title="Current Date"></div>

          <button type="button" class="icon-btn" id="themeToggleBtn" title="Switch Light/Dark Theme"
            aria-label="Switch Theme">
            <svg id="themeIconSun" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
              fill="none" hidden>
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="themeIconMoon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
              fill="none">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <!-- Notification Bell & Dropdown -->
          <div class="notification-wrapper">
            <button type="button" class="icon-btn notification-btn" id="notificationBtn" aria-label="Notifications"
              title="Notifications">
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
              <span class="notification-dot" id="notificationDot" hidden></span>
            </button>
            <div class="notification-dropdown" id="notificationDropdown" hidden>
              <div class="dropdown-header">
                <h3>BANTUG UNIVERSITY Notices</h3>
                <button type="button" class="btn-text" id="markAllReadTopBtn">Mark read</button>
              </div>
              <div class="dropdown-body" id="notificationList"></div>
            </div>
          </div>

          <!-- Active User Profile Pill -->
          <button type="button" class="topbar-profile-btn" id="topbarProfileBtn" title="View Profile">
            <img src="assets/images/default-avatar.svg" alt="User Avatar" class="topbar-avatar" id="topbarAvatar" />
            <div class="topbar-user-info">
              <span class="topbar-user-name" id="topbarStudentName">Racel Valiente</span>
              <span class="topbar-user-meta" id="topbarStudentMeta">BSIT 2-2</span>
            </div>
          </button>

          <!-- Topbar Logout Icon Button -->
          <button type="button" class="icon-btn logout-icon-btn" id="topbarLogoutBtn"
            title="Log Out / Return to Login Page" aria-label="Log Out">
            <svg viewBox="0 0 24 24" width="19" height="19" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>
