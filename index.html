<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="BANTUG UNIVERSITY - Student Portal System (Student, Faculty, and Applicant Portals)" />
  <title>BANTUG UNIVERSITY | Student Portal System</title>
  <link rel="icon" type="image/png" href="assets/images/bantug-university-logo.png" />
  <!-- Google Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <!-- Modular Application Stylesheet Entry Point & Login Stylesheet -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <!-- 1. Login & Access Interface -->
  <div data-partial="pages/login.html"></div>

  <!-- 2. Authenticated Portal Shell -->
  <div class="app-layout" id="appLayout" hidden>
    <!-- Shared Mobile Overlay, Left Sidebar & Navigation -->
    <div data-partial="pages/shared/sidebar.html"></div>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Shared Header / Top Navigation Bar -->
      <div data-partial="pages/shared/header.html"></div>

      <!-- Module Sections -->
      <main class="content-area" id="mainContent">
        <div data-partial="pages/student/dashboard.html"></div>
        <div data-partial="pages/student/profile.html"></div>
        <div data-partial="pages/student/subjects.html"></div>
        <div data-partial="pages/student/schedule.html"></div>
        <div data-partial="pages/student/grades.html"></div>
        <div data-partial="pages/student/attendance.html"></div>
        <div data-partial="pages/student/tasks.html"></div>
        <div data-partial="pages/student/announcements.html"></div>
        <div data-partial="pages/student/resources.html"></div>
        <div data-partial="partials/sections/student-sections.html"></div>
        <div data-partial="partials/sections/faculty-sections.html"></div>
        <div data-partial="partials/sections/applicant-sections.html"></div>
        <div data-partial="partials/sections/shared-sections.html"></div>
      </main>

      <!-- Application Footer -->
      <div data-partial="partials/layout/footer.html"></div>
    </div>
  </div>

  <!-- 3. Shared Dialogs & Notifications -->
  <div data-partial="partials/components/modals.html"></div>
  <div data-partial="partials/components/toast-container.html"></div>

  <!-- 4. HTML Partial Loader & Sequential Application Module Bootstrapper -->
  <script src="js/partials-loader.js"></script>
</body>

</html>
